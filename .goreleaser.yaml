# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: jevrules

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: jevrules
    main: ./cmd/jevrules
    binary: jevrules
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    targets:
      - linux_amd64
      - darwin_arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - jevrules.schema.json

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
